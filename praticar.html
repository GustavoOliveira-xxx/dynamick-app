<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <script>

      try {
        var s = JSON.parse(localStorage.getItem("dynamick:session:v1") || "null");
        var k = s && s.accountId ? "dynamick:v1:" + s.accountId : "dynamick:v1";
        var p = JSON.parse(localStorage.getItem(k) || "{}").preferences || {};
        var r = document.documentElement;
        r.dataset.theme = p.theme || "dark";
        r.dataset.textScale = p.textScale || "100";
        if (p.highContrast) r.dataset.contrast = "high";
        if (p.reducedMotion === "reduced" || p.reducedMotion === "full") r.dataset.motion = p.reducedMotion;
        if (p.visualIntensity === "reduced") r.dataset.visual = "reduced";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Praticar · Dynamic CK</title>
    <meta name="description" content="Escolha uma sessão pronta, um tópico ou uma prática rápida." />
    <meta name="theme-color" content="#020504" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/brand/favicon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/brand/favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="modulepreload" href="js/pages/praticar.js" />
  </head>

  <body data-page="praticar">

    <div class="ck-boot" id="ck-boot" role="status" aria-live="polite">
      <div class="ck-boot__stage" aria-hidden="true">
        <span class="ck-boot__glow"></span>
        <div class="ck-boot__orbits">
          <span class="ck-boot__orbit ck-boot__orbit--a"></span>
          <span class="ck-boot__orbit ck-boot__orbit--b"></span>
          <span class="ck-boot__orbit ck-boot__orbit--c"></span>
        </div>
        <div class="ck-boot__sparks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <svg class="ck-boot__arc" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="ck-boot-degrade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#35d6c0" />
              <stop offset="55%" stop-color="#5cffb0" />
              <stop offset="100%" stop-color="#b8f36a" />
            </linearGradient>
          </defs>
          <circle class="ck-boot__arc-track" cx="100" cy="100" r="92" />
          <circle class="ck-boot__arc-run" cx="100" cy="100" r="92" />
        </svg>
        <div class="ck-boot__logo">
          <picture>
            <source srcset="assets/brand/logo-dynamic.webp" type="image/webp" />
            <img src="assets/brand/logo-dynamic.png" alt="" width="116" height="105" decoding="async" fetchpriority="high" />
          </picture>
          <span class="ck-boot__shine"></span>
        </div>
      </div>
      <p class="ck-boot__word" aria-hidden="true">
        <span>D</span><span>y</span><span>n</span><span>a</span><span>m</span><span>i</span><span class="ck-boot__ck">CK</span>
      </p>
      <p class="ck-boot__label">Preparando sua prática</p>
      <p class="ck-boot__signature" aria-hidden="true">Powered by Conscious Knowledge</p>
      <div class="ck-boot__bar" aria-hidden="true"><span></span></div>
    </div>

    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <div id="fundo" aria-hidden="true"></div>

    <div class="app" id="app-shell">
      <header class="app-header">
        <div class="shell app-header__inner">
          <a href="inicio.html#/inicio" id="marca" aria-label="Dynamic CK, ir para o início"></a>
          <div class="row app-header__actions" id="cabecalho-acoes"></div>
        </div>
      </header>

      <div class="shell app-body">
        <nav class="app-nav" id="navegacao" aria-label="Navegação principal"></nav>
        <main id="conteudo-principal" class="app-main" tabindex="-1"></main>
      </div>

      <nav class="app-nav-mobile" id="navegacao-mobile" aria-label="Navegação principal"></nav>
    </div>

    <noscript>
      <div class="shell" style="padding: 2rem 0">
        <div class="message message--warning">
          <p class="message__title">Esta parte precisa de JavaScript</p>
          <p>
            A área de estudo é interativa e roda inteiramente no seu navegador. Ative o JavaScript
            para continuar. O conteúdo institucional continua disponível em
            <a href="index.html">página inicial</a>, <a href="sobre.html">sobre</a> e
            <a href="privacidade.html">privacidade</a>.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="js/pages/praticar.js"></script>
    <script type="module" src="js/pwa.js"></script>
  </body>
</html>
