<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var falhas = [];
        var modulos = [];
        var mostrado = false;
        var prazo = 15000;

        function anotar(texto) {
          if (!texto) return;
          texto = String(texto);
          if (falhas.indexOf(texto) === -1) falhas.push(texto);
          var achado = texto.match(/['"]([^'"]+\.m?js)['"]/);
          if (achado && modulos.indexOf(achado[1]) === -1) modulos.push(achado[1]);
          prazo = 1500;
          setTimeout(mostrar, 1500);
        }

        addEventListener('error', function (evento) {
          if (evento.target && evento.target.src) anotar('não carregou ' + evento.target.src);
          else anotar(evento.message);
        }, true);

        addEventListener('unhandledrejection', function (evento) {
          var causa = evento.reason;
          anotar(causa && causa.message ? causa.message : causa);
        });

        function ativo() {
          var boot = document.getElementById('ck-boot');
          if (!boot || boot.hidden) return null;
          if (boot.className.indexOf('ck-boot--done') !== -1) return null;
          return boot;
        }

        function limpar(botao) {
          botao.textContent = 'Atualizando…';
          var tarefas = modulos.concat([location.pathname]).map(function (u) {
            return fetch(u, { cache: 'reload' }).catch(function () {});
          });
          if (window.caches && caches.keys) {
            tarefas.push(caches.keys().then(function (nomes) {
              return Promise.all(nomes.map(function (n) { return caches.delete(n); }));
            }).catch(function () {}));
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tarefas.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
          }
          Promise.all(tarefas).catch(function () {}).then(function () {
            location.reload();
          });
        }

        function mostrar() {
          var boot = ativo();
          if (mostrado || !boot) return;
          mostrado = true;

          var painel = document.createElement('div');
          painel.className = 'ck-falha';

          var titulo = document.createElement('h1');
          titulo.textContent = 'Não conseguimos abrir esta tela';

          var texto = document.createElement('p');
          texto.textContent = 'Isso costuma acontecer logo depois de uma atualização, quando o navegador ainda guarda uma parte antiga do site. O botão abaixo busca a versão nova e abre de novo.';

          var acoes = document.createElement('div');
          acoes.className = 'ck-falha__acoes';

          var principal = document.createElement('button');
          principal.type = 'button';
          principal.className = 'ck-falha__botao';
          principal.textContent = 'Atualizar e abrir de novo';
          principal.addEventListener('click', function () { limpar(principal); });

          var simples = document.createElement('button');
          simples.type = 'button';
          simples.className = 'ck-falha__botao ck-falha__botao--simples';
          simples.textContent = 'Só recarregar';
          simples.addEventListener('click', function () { location.reload(); });

          acoes.appendChild(principal);
          acoes.appendChild(simples);
          painel.appendChild(titulo);
          painel.appendChild(texto);
          painel.appendChild(acoes);

          if (falhas.length) {
            var detalhe = document.createElement('p');
            detalhe.className = 'ck-falha__detalhe';
            detalhe.textContent = falhas[0];
            painel.appendChild(detalhe);
          }

          boot.textContent = '';
          boot.className = 'ck-boot ck-boot--falhou';
          boot.appendChild(painel);
        }

        setTimeout(function () { mostrar(); }, prazo);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Abrindo · Dynamic CK</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#020504" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="assets/brand/favicon.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script>

      (function () {
        var MAPA = [
          ['/entrar', 'entrar.html'],
          ['/onboarding', 'onboarding.html'],
          ['/inicio', 'inicio.html'],
          ['/diagnostico', 'inicio.html'],
          ['/conteudos', 'conteudos.html'],
          ['/praticar', 'praticar.html'],
          ['/sessao', 'sessao.html'],
          ['/revisar', 'revisar.html'],
          ['/simulados', 'simulados.html'],
          ['/enems', 'enems.html'],
          ['/redacao', 'redacao.html'],
          ['/metodos', 'metodos.html'],
          ['/buscar', 'buscar.html'],
          ['/catalogo', 'catalogo.html'],
          ['/perfil', 'perfil.html'],
        ];

        var bruto = (location.hash || '').replace(/^#/, '');
        var rota = bruto.split('?')[0] || '/inicio';
        var busca = bruto.split('?')[1];
        if (rota.charAt(0) !== '/') rota = '/' + rota;

        var destino = 'inicio.html';
        var maior = 0;
        for (var i = 0; i < MAPA.length; i += 1) {
          var prefixo = MAPA[i][0];
          if ((rota === prefixo || rota.indexOf(prefixo + '/') === 0) && prefixo.length > maior) {
            destino = MAPA[i][1];
            maior = prefixo.length;
          }
        }

        location.replace(destino + '#' + rota + (busca ? '?' + busca : ''));
      })();
    </script>
  </head>

  <body>
    <div class="ck-boot" id="ck-boot" role="status" aria-live="polite">
      <div class="ck-boot__stage" aria-hidden="true">
        <span class="ck-boot__glow"></span>
        <div class="ck-boot__orbits">
          <span class="ck-boot__orbit ck-boot__orbit--a"></span>
          <span class="ck-boot__orbit ck-boot__orbit--b"></span>
          <span class="ck-boot__orbit ck-boot__orbit--c"></span>
        </div>
        <div class="ck-boot__sparks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <svg class="ck-boot__arc" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="ck-boot-degrade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#35d6c0" />
              <stop offset="55%" stop-color="#5cffb0" />
              <stop offset="100%" stop-color="#b8f36a" />
            </linearGradient>
          </defs>
          <circle class="ck-boot__arc-track" cx="100" cy="100" r="92" />
          <circle class="ck-boot__arc-run" cx="100" cy="100" r="92" />
        </svg>
        <div class="ck-boot__logo">
          <picture>
            <source srcset="assets/brand/logo-dynamic.webp" type="image/webp" />
            <img src="assets/brand/logo-dynamic.png" alt="" width="116" height="105" decoding="async" />
          </picture>
          <span class="ck-boot__shine"></span>
        </div>
      </div>
      <p class="ck-boot__word" aria-hidden="true">
        <span>D</span><span>y</span><span>n</span><span>a</span><span>m</span><span>i</span><span class="ck-boot__ck">CK</span>
      </p>
      <p class="ck-boot__label">Levando você para a tela certa</p>
      <p class="ck-boot__signature" aria-hidden="true">Powered by Conscious Knowledge</p>
      <div class="ck-boot__bar" aria-hidden="true"><span></span></div>
    </div>

    <noscript>
      <div class="shell" style="padding: 2rem 0">
        <div class="message message--warning">
          <p class="message__title">Este endereço mudou</p>
          <p>
            A área de estudo agora começa em
            <a href="inicio.html#/inicio">inicio.html</a>. Para entrar na sua conta, use
            <a href="entrar.html#/entrar">entrar.html</a>.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="js/pwa.js"></script>
  </body>
</html>
