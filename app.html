<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Abrindo · Dynamic CK</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#020504" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="assets/brand/favicon.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script>

      (function () {
        var MAPA = [
          ['/entrar', 'entrar.html'],
          ['/onboarding', 'onboarding.html'],
          ['/inicio', 'inicio.html'],
          ['/diagnostico', 'inicio.html'],
          ['/conteudos', 'conteudos.html'],
          ['/praticar', 'praticar.html'],
          ['/sessao', 'sessao.html'],
          ['/revisar', 'revisar.html'],
          ['/simulados', 'simulados.html'],
          ['/enems', 'enems.html'],
          ['/redacao', 'redacao.html'],
          ['/metodos', 'metodos.html'],
          ['/buscar', 'buscar.html'],
          ['/catalogo', 'catalogo.html'],
          ['/perfil', 'perfil.html'],
        ];

        var bruto = (location.hash || '').replace(/^#/, '');
        var rota = bruto.split('?')[0] || '/inicio';
        var busca = bruto.split('?')[1];
        if (rota.charAt(0) !== '/') rota = '/' + rota;

        var destino = 'inicio.html';
        var maior = 0;
        for (var i = 0; i < MAPA.length; i += 1) {
          var prefixo = MAPA[i][0];
          if ((rota === prefixo || rota.indexOf(prefixo + '/') === 0) && prefixo.length > maior) {
            destino = MAPA[i][1];
            maior = prefixo.length;
          }
        }

        location.replace(destino + '#' + rota + (busca ? '?' + busca : ''));
      })();
    </script>
  </head>

  <body>
    <div class="ck-boot" id="ck-boot" role="status" aria-live="polite">
      <div class="ck-boot__stage" aria-hidden="true">
        <span class="ck-boot__glow"></span>
        <div class="ck-boot__orbits">
          <span class="ck-boot__orbit ck-boot__orbit--a"></span>
          <span class="ck-boot__orbit ck-boot__orbit--b"></span>
          <span class="ck-boot__orbit ck-boot__orbit--c"></span>
        </div>
        <div class="ck-boot__sparks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <svg class="ck-boot__arc" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="ck-boot-degrade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#35d6c0" />
              <stop offset="55%" stop-color="#5cffb0" />
              <stop offset="100%" stop-color="#b8f36a" />
            </linearGradient>
          </defs>
          <circle class="ck-boot__arc-track" cx="100" cy="100" r="92" />
          <circle class="ck-boot__arc-run" cx="100" cy="100" r="92" />
        </svg>
        <div class="ck-boot__logo">
          <picture>
            <source srcset="assets/brand/logo-dynamic.webp" type="image/webp" />
            <img src="assets/brand/logo-dynamic.png" alt="" width="116" height="105" decoding="async" />
          </picture>
          <span class="ck-boot__shine"></span>
        </div>
      </div>
      <p class="ck-boot__word" aria-hidden="true">
        <span>D</span><span>y</span><span>n</span><span>a</span><span>m</span><span>i</span><span class="ck-boot__ck">CK</span>
      </p>
      <p class="ck-boot__label">Levando você para a tela certa</p>
      <p class="ck-boot__signature" aria-hidden="true">Powered by Conscious Knowledge</p>
      <div class="ck-boot__bar" aria-hidden="true"><span></span></div>
    </div>

    <noscript>
      <div class="shell" style="padding: 2rem 0">
        <div class="message message--warning">
          <p class="message__title">Este endereço mudou</p>
          <p>
            A área de estudo agora começa em
            <a href="inicio.html#/inicio">inicio.html</a>. Para entrar na sua conta, use
            <a href="entrar.html#/entrar">entrar.html</a>.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="js/pwa.js"></script>
  </body>
</html>
